quadrotor_env:
   camera: no
   sim_dt: 0.02 
   max_t: 4.0
   add_camera: yes

quadrotor_dynamics:
  mass: 0.752
  arm_l: 0.17
  motor_omega_min: 150.0 # motor rpm min
  motor_omega_max: 2800.0 # motor rpm max
  motor_tau: 0.033 # motor step response
  thrust_map: [1.562522e-6, 0.0,  0.0]
  kappa: 0.022 # rotor drag coeff
  omega_max: [15.0, 15.0, 4.0]  # body rate constraint (x, y, z) 

rl:
  pos_coeff: -0.002        # reward coefficient for position 
  ori_coeff: -0.002        # reward coefficient for orientation
  lin_vel_coeff: -0.0002   # reward coefficient for linear velocity
  ang_vel_coeff: -0.0002   # reward coefficient for angular velocity
  act_coeff: -0.008  # reward coefficient for control actions # -> Normally -0.002